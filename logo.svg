<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="100%" height="100%">
  <defs>
    <!-- Paper gradient for the hang tag -->
    <linearGradient id="clPaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfaf4" />
      <stop offset="100%" stop-color="#ece1cf" />
    </linearGradient>
    <!-- Thread gradient -->
    <linearGradient id="clThread" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <!-- Wordmark accent -->
    <linearGradient id="clAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <style>
    .cl-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      font-size: 40px;
      letter-spacing: -0.6px;
    }
    .cl-eyebrow {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 600;
      font-size: 10.5px;
      letter-spacing: 1.9px;
      text-transform: uppercase;
    }
    .cl-desc {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 400;
      font-size: 13px;
      letter-spacing: 0.1px;
    }
    .cl-mono {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      letter-spacing: 0.2px;
    }
    .cl-cap {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 700;
      font-size: 5.2px;
      letter-spacing: 0.55px;
    }
  </style>

  <!-- Card background -->
  <rect width="540" height="140" rx="16" fill="#0b1329" />
  <rect width="538" height="138" x="1" y="1" rx="15" fill="none" stroke="#1e293b" stroke-width="1.2" />

  <!-- HANG TAG ICON (contained in 22..126 x 14..126) -->
  <g transform="translate(22, 14)">
    <!-- Thread loop from the eyelet, kept well inside the icon box -->
    <path d="M 42 30 C 46 18, 58 13, 70 16" fill="none" stroke="url(#clThread)"
          stroke-width="2.2" stroke-linecap="round" opacity="0.85" />

    <!-- Tag body with clipped top-left corner -->
    <path d="M 42 26 L 84 26 L 94 36 L 94 104 L 30 104 L 30 36 Z"
          fill="url(#clPaper)" stroke="#b9ab92" stroke-width="1.4" stroke-linejoin="round" />
    <!-- Fold shading -->
    <path d="M 42 26 L 42 36 L 30 36 Z" fill="#d8cbb6" opacity="0.7" />

    <!-- Eyelet -->
    <circle cx="42" cy="36" r="3.6" fill="#0f172a" opacity="0.13" />
    <circle cx="42" cy="36" r="2.4" fill="#334155" opacity="0.6" />

    <!-- Stitched inner border -->
    <path d="M 36 46 L 88 46 L 88 98 L 36 98 Z" fill="none" stroke="#a8b3c1"
          stroke-width="1.3" stroke-dasharray="3.6 3" stroke-linejoin="round" />

    <!-- Monogram -->
    <text x="62" y="70" text-anchor="middle" class="cl-mono" font-size="16" fill="#1f2937">O/M</text>

    <line x1="44" y1="78" x2="80" y2="78" stroke="#cbd5e1" stroke-width="1" />

    <!-- Two-line care caption, sized to stay inside the stitch box -->
    <text x="62" y="86" text-anchor="middle" class="cl-cap" fill="#64748b">SIZE · FABRIC</text>
    <text x="62" y="94" text-anchor="middle" class="cl-cap" fill="#94a3b8">EVIDENCE</text>
  </g>

  <!-- WORDMARK -->
  <g transform="translate(152, 34)">
    <text x="0" y="10" fill="#38bdf8" class="cl-eyebrow">Wardrobe-First Styling Agent</text>
    <text x="0" y="52" class="cl-title">
      <tspan fill="#f8fafc">Outfit</tspan>
      <tspan fill="url(#clAccent)"> Me</tspan>
    </text>
    <text x="0" y="76" fill="#94a3b8" class="cl-desc">
      Local-first wardrobe · evidence-backed shopping
    </text>
  </g>
</svg>
